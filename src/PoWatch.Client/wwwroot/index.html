<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoWatch</title>
    <base href="/" />
    <!-- Local-first (NET_RUN_10): Inter is self-hosted, not loaded from the Google CDN,
         so typography (and the app's offline/vendored supply-chain rule) no longer
         depends on an outbound network request. -->
    <style>
        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("lib/fonts/inter-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
    </style>
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/features.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PoWatch.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- theme-controller.js must come BEFORE blazor.webassembly.js so it sets
         data-theme on <html> synchronously before any Radzen/Blazor paint. -->
    <script src="js/theme-controller.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/preferences.js"></script>
    <script src="js/inference-bridge.js"></script>
    <script src="js/audio-bridge.js"></script>
    <script src="js/blob-upload.js"></script>
    <script src="js/keyboard-bindings.js"></script>
    <script src="js/webcam-shell.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
