<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title>Camera unavailable</title>
  <desc>A crossed-out camera icon shown when the webcam cannot be reached.</desc>
  <!--
    Was a large smiling face in the "all good" green. On a care-monitoring wall display that read
    as a reassuring status while the camera was in fact not working at all — the failure state
    looked friendlier than the working one. It is now a neutral, muted crossed-out camera.
  -->
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1325" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <g fill="none" stroke="#6b7192" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="309" y="168" width="132" height="96" rx="14" />
    <path d="M455 196 L505 172 L505 260 L455 236 Z" />
    <line x1="313" y1="276" x2="503" y2="158" stroke="#9ea2bc" />
  </g>
  <text x="400" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#ecf1ff">Camera unavailable</text>
  <text x="400" y="374" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#9ea2bc">Check it is connected and not in use by another app</text>
</svg>
