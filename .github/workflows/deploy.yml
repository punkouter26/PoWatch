name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      emergency:
        description: 'Emergency deploy: skip the formatting and test gates (use only when production is down and the fix must ship now)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-powatch-win
  AZURE_RESOURCE_GROUP: PoWatch
  SOLUTION_PATH: PoWatch.slnx
  API_PROJECT_PATH: src/PoWatch.Api/PoWatch.Api.csproj

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.SOLUTION_PATH }}
      - run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release
      # Skippable via workflow_dispatch 'emergency' input so a whitespace error in a test file
      # can never block a hotfix while production is down (2026-07-06: FINALNEWLINE blocked recovery).
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.emergency) }}
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity minimal

      # Test gate. Suites run separately so a failure names the layer that broke rather than a
      # single opaque "tests failed". Shares the 'emergency' escape hatch with the formatting gate
      # above — a red test must never trap a hotfix while production is down (2026-07-06 outage).
      - name: Unit tests (pure logic, no I/O)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.emergency) }}
        run: dotnet test tests/PoWatch.Unit/PoWatch.Unit.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory testresults
      # Testcontainers pulls the Azurite image; Docker is preinstalled on ubuntu-latest runners.
      - name: Integration tests (Azurite via Testcontainers)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.emergency) }}
        run: dotnet test tests/PoWatch.Integration/PoWatch.Integration.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory testresults
      - name: API E2E tests (contract)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.emergency) }}
        run: dotnet test tests/PoWatch.E2EAPI/PoWatch.E2EAPI.csproj -c Release --no-build --logger "trx;LogFileName=e2eapi.trx" --results-directory testresults
      # PlaywrightFixture self-skips when E2E_BASE_URL is unset, so this is a no-op against a
      # headless build. Set E2E_BASE_URL (repo variable) to point the suite at a live deployment.
      - name: UI E2E tests (Playwright)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.emergency) }}
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: |
          if [ -n "$E2E_BASE_URL" ]; then
            pwsh tests/PoWatch.E2EUI/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          fi
          dotnet test tests/PoWatch.E2EUI/PoWatch.E2EUI.csproj -c Release --no-build --logger "trx;LogFileName=e2eui.trx" --results-directory testresults
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: testresults
          retention-days: 7

      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    environment:
      name: production
      url: https://app-powatch-win.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          # These are stored as repository SECRETS (not variables), so reference secrets.* —
          # vars.* resolved to empty and azure/login failed with "not all values are present".
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: cd publish && zip -r ../webapp.zip . && cd ..
      # WARNING ONLY — do not make this fail the deploy. netFrameworkVersion reads 'v4.0' on
      # Windows App Service even for healthy .NET Core/5+ apps (verified 2026-07-06: two healthy
      # deploys ran with v4.0 configured, then this check as a hard gate blocked all deploys
      # during a production outage whose actual cause was a missing managed identity).
      - name: Check .NET runtime stack (informational)
        run: |
          STACK=$(az webapp config show -n "${{ env.AZURE_WEBAPP_NAME }}" -g "${{ env.AZURE_RESOURCE_GROUP }}" --query "netFrameworkVersion" -o tsv || echo "unknown")
          echo "Configured netFrameworkVersion: $STACK"
          case "$STACK" in
            v10.*) echo "Runtime stack explicitly set for net10.0." ;;
            *) echo "::warning::netFrameworkVersion is '$STACK' (not v10.x). This is often fine on Windows App Service — v4.0 is a common default reading for .NET Core/5+ apps — but if the app 500.30s with a missing-runtime error, check the stack setting." ;;
          esac
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip
      - name: Verify deployment (health + boot readiness gate)
        run: |
          BASE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          sleep 20
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" --max-time 30 || echo "000")
            echo "Health check attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Deployment verified."; exit 0; fi
            sleep 15
          done
          echo "::error::Health check did not return 200 after 5 attempts — the deployment is NOT healthy."
          echo "----- /diag/boot (last startup milestone + dependency readiness) -----"
          curl -s "$BASE/diag/boot" --max-time 30 || echo "(/diag/boot unreachable — the host failed to start; NO in-app endpoint can answer a 500.30)"
          echo ""
          echo "To find the real startup exception (see docs/technical/deployment-guidelines.md):"
          echo "  az webapp log download -n ${{ env.AZURE_WEBAPP_NAME }} -g ${{ env.AZURE_RESOURCE_GROUP }} --log-file logs.zip"
          echo "  then read LogFiles/eventlog.xml — the '.NET Runtime' entries contain the full stack trace."
          exit 1