name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-powatch-win
  AZURE_RESOURCE_GROUP: PoWatch
  SOLUTION_PATH: PoWatch.slnx
  API_PROJECT_PATH: src/PoWatch.Api/PoWatch.Api.csproj

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.SOLUTION_PATH }}
      - run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release
      - run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity minimal
      # Rule 6.4: tests are NOT run in the CI/CD pipeline — they run locally / pre-merge
      # (unit + integration via Testcontainers, E2E via Playwright).
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
      url: https://app-powatch-win.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          # These are stored as repository SECRETS (not variables), so reference secrets.* —
          # vars.* resolved to empty and azure/login failed with "not all values are present".
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: cd publish && zip -r ../webapp.zip . && cd ..
      - name: Assert .NET runtime stack (catch a missing net10.0 before it becomes a 500.30)
        run: |
          STACK=$(az webapp config show -n "${{ env.AZURE_WEBAPP_NAME }}" -g "${{ env.AZURE_RESOURCE_GROUP }}" --query "netFrameworkVersion" -o tsv || echo "unknown")
          echo "Configured netFrameworkVersion: $STACK"
          case "$STACK" in
            v10.*) echo "Runtime stack OK for net10.0." ;;
            *) echo "::error::App Service .NET stack is '$STACK' but the app targets net10.0. A framework-dependent deploy will fail with HTTP 500.30 until the stack is v10.x."; exit 1 ;;
          esac
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip
      - name: Verify deployment (health + boot readiness gate)
        run: |
          BASE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          sleep 20
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" --max-time 30 || echo "000")
            echo "Health check attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Deployment verified."; exit 0; fi
            sleep 15
          done
          echo "::error::Health check did not return 200 after 5 attempts — the deployment is NOT healthy."
          echo "----- /diag/boot (last startup milestone + dependency readiness) -----"
          curl -s "$BASE/diag/boot" --max-time 30 || echo "(/diag/boot unreachable — the host likely failed to start; check Log Stream for the startup exception)"
          echo ""
          exit 1