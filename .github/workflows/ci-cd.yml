name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # allow manual triggers

permissions:
  contents: read
  id-token: write   # required for OIDC login

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-powatch
  AZURE_RESOURCE_GROUP: PoWatch
  SOLUTION_PATH: PoWatch.slnx
  API_PROJECT_PATH: src/PoWatch.Api/PoWatch.Api.csproj
  UNIT_TEST_PATH: tests/PoWatch.UnitTests
  INTEGRATION_TEST_PATH: tests/PoWatch.IntegrationTests

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Build & Test
  # ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release

      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity minimal

      - name: Run unit tests
        run: dotnet test ${{ env.UNIT_TEST_PATH }} -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-restore -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  # ──────────────────────────────────────────────
  # Deploy to Azure App Service
  # (only on push to master, not PRs)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
      url: https://app-powatch.azurewebsites.net

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Debug — list publish directory
        run: |
          echo "=== Files in publish/ ==="
          ls -la publish/
          echo "=== runtimeconfig ==="
          ls publish/*.runtimeconfig.json || echo "NO runtimeconfig.json found!"

      - name: Package publish as zip
        run: cd publish && zip -r ../webapp.zip . && cd ..

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip

      - name: Verify deployment (health check)
        run: |
          echo "Waiting for app to warm up..."
          sleep 20
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://app-powatch.azurewebsites.net/health" --max-time 30 || echo "000")
            echo "Health check attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment verified successfully."
              exit 0
            fi
            sleep 15
          done
          echo "WARNING: Health check did not return 200 after 5 attempts — app may still be warming up."
